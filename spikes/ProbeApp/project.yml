name: ProbeApp
options:
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  ProbeApp:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Info.plist
    dependencies:
      - package: Sparkle
    settings:
      base:
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        PRODUCT_BUNDLE_IDENTIFIER: io.github.junjuny0227.doorplate.probe
        PRODUCT_NAME: ProbeApp
