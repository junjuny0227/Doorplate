name: Doorplate
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions: [en, ko, ja, zh-Hans]
packages:
  DoorplateCore:
    path: Packages/DoorplateCore
  DoorplateMenu:
    path: Packages/DoorplateMenu
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: io.github.junjuny0227.doorplate
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_VERSION: "6.0"
targets:
  Doorplate:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Resources/Info.plist]
    settings:
      base:
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: DoorplateCore
      - package: DoorplateMenu
      - package: Sparkle
schemes:
  Doorplate:
    build:
      targets:
        Doorplate: all
