name: CI

on:
  # Docs-only changes do not affect builds or tests. No .md file outside docs/ is a
  # test input. If CI becomes a required check, switch to a job-level filter: a
  # skipped workflow never reports, so a required check would wait forever.
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']

  # macos-latest moves to newer Xcode and Swift without a commit here; a weekly run
  # catches a toolchain change before the next PR does.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  # Decides which jobs a change needs, like Repot's CI. A change that touches only the
  # product site (site/, its npm and Biome config) runs `site` alone; a change that
  # touches none of those skips `site`. Files both sides read (the app icon,
  # project.yml for the version, this workflow) run everything. A new branch, a force
  # push with no usable base, or the weekly schedule also runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.paths.outputs.site }}
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          all() {
            echo 'site=true' >> "$GITHUB_OUTPUT"
            echo 'app=true' >> "$GITHUB_OUTPUT"
            exit 0
          }
          [[ "$EVENT" == schedule ]] && all
          if [[ "$EVENT" == pull_request ]]; then
            base="$PR_BASE" head="$PR_HEAD"
          else
            base="$PUSH_BEFORE" head="$GITHUB_SHA"
          fi
          if ! changed=$(git diff --name-only "$base" "$head" 2>/dev/null) || [[ -z "$changed" ]]; then
            all
          fi
          printf 'Changed files:\n%s\n' "$changed"
          shared='^(assets/AppIcon\.svg|project\.yml|\.github/workflows/ci\.yml)$'
          site_only='^(site/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|biome\.json$|\.github/workflows/pages\.yml$)'
          ignored='^(docs/|LICENSE$)|\.md$'
          if grep -Eq "$shared|$site_only" <<< "$changed"; then
            echo 'site=true' >> "$GITHUB_OUTPUT"
          fi
          # Not a pipeline: under pipefail, grep -q closing early can fail the first grep.
          rest=$(grep -Ev "$site_only" <<< "$changed" || true)
          if grep -Eq "$shared" <<< "$changed" || { [[ -n "$rest" ]] && grep -Evq "$ignored" <<< "$rest"; }; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
          fi

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm --filter @doorplate/site test
      - run: pnpm --filter @doorplate/site build

  # Formatting and the Core import boundary; writes nothing.
  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift format lint --strict --recursive Packages App
      - run: scripts/check-core-imports.sh

  core:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift test --package-path Packages/DoorplateCore
      - run: swift test --package-path Packages/DoorplateMenu

  release-tools:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift test --package-path Packages/ReleaseTools

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Doorplate.xcodeproj -scheme Doorplate -configuration Debug CODE_SIGN_IDENTITY=- build

  scripts:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # All warnings and errors fail CI.
      - run: shellcheck --severity=warning scripts/*.sh
