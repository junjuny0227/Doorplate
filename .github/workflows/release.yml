name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build release
        run: |
          set -euo pipefail
          scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Create draft with checksum and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          checksum = Path(f"dist/Doorplate-{version}.zip.sha256").read_text().split()[0]
          template = Path(".github/release-notes.md").read_text()
          Path("notes.md").write_text(template.replace("{{SHA256}}", checksum))
          PY
          # --generate-notes appends GitHub's notes (PRs since the previous tag, grouped by
          # label per .github/release.yml) after notes.md. Edit the draft before publishing:
          # add a "## Changes" summary on top (docs/checklists/release.md).
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease=false \
            --title "Doorplate ${VERSION} (beta)" --notes-file "notes.md" --generate-notes \
            "dist/Doorplate-${VERSION}.zip" "dist/Doorplate-${VERSION}.zip.sha256"
